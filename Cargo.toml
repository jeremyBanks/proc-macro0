[package]
name = "proc-macro0"
version = "1.0.104"
authors = ["David Tolnay <dtolnay@gmail.com>", "Alex Crichton <alex@alexcrichton.com>"]
autobenches = false
categories = ["development-tools::procedural-macro-helpers"]
description = "A fork of proc-macro2 with an optional `sync` feature for thread-safe usage outside of procedural macros."
documentation = "https://docs.rs/proc-macro0"
edition = "2021"
keywords = ["macros", "syn"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jeremyBanks/proc-macro0"
rust-version = "1.68"

[package.metadata.docs.rs]
rustc-args = ["--cfg=procmacro2_semver_exempt"]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = [
    "--cfg=procmacro2_semver_exempt",
    "--generate-link-to-definition",
    "--generate-macro-expansion",
    "--extern-html-root-url=core=https://doc.rust-lang.org",
    "--extern-html-root-url=alloc=https://doc.rust-lang.org",
    "--extern-html-root-url=std=https://doc.rust-lang.org",
    "--extern-html-root-url=proc_macro=https://doc.rust-lang.org",
]

[dependencies]
unicode-ident = "1.0"

# Required for the `sync` feature
once_cell = { version = "1.13", optional = true }
parking_lot = { version = "0.12", optional = true }

[dev-dependencies]
flate2 = "1.0"
quote = { version = "1.0", default-features = false }
rayon = "1.0"
rustversion = "1"
tar = "0.4"

[features]
# Enables wrapping the real compiler proc_macro types. Use this when writing
# procedural macros. Mutually exclusive with `sync`.
proc-macro = []

# Thread-safe (Send + Sync) token streams for use outside of procedural macros.
# When enabled, always uses the fallback implementation with Arc/RwLock instead
# of Rc/RefCell, making all types Send + Sync. Mutually exclusive with `proc-macro`.
sync = ["once_cell", "parking_lot"]

# Default is neither - basic fallback, not thread-safe, not proc-macro compatible.
# Users must explicitly choose `proc-macro` OR `sync` based on their use case.
default = []

# Expose methods Span::start and Span::end which give the line/column location
# of a token.
span-locations = []

# This feature no longer means anything.
nightly = []

[workspace]
members = ["benches/bench-libproc-macro", "tests/ui"]

[patch.crates-io]
# Our doc tests depend on quote which depends on proc-macro2. Without this line,
# the proc-macro2 dependency of quote would be the released version of
# proc-macro2. Quote would implement its traits for types from that proc-macro2,
# meaning impls would be missing when tested against types from the local
# proc-macro2.
#
# GitHub Actions builds that are in progress at the time that you publish may
# spuriously fail. This is because they'll be building a local proc-macro0 which
# carries the second-most-recent version number, pulling in quote which resolves
# to a dependency on the just-published most recent version number. Thus the
# patch will fail to apply because the version numbers are different.
proc-macro0 = { path = "." }
